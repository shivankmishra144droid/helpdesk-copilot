services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    # Bound to localhost only; the API has no user accounts.
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      # Reach an Ollama running on the host, if you use one.
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Approvals, the supervisor queue and the audit log persist here. The first
      # start seeds the volume from the image's synthetic knowledge base.
      - knowledge:/app/backend/knowledge
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/branches', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE: http://localhost:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  knowledge:
